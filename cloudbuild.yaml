steps:
  # 0. Build frontend static assets (Tailwind CSS)
  - name: 'node'
    entrypoint: npm
    args: ['install']
    dir: 'web_app_dashboard/frontend'
  - name: 'node'
    entrypoint: npx
    args: ['tailwindcss', '-i', './assets/css/input.css', '-o', './assets/css/style.css']
    dir: 'web_app_dashboard/frontend'

  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nutrition-service:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nutrition-service:$COMMIT_SHA']

  # 3. Deploy to Cloud Run in me-west1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nutrition-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nutrition-service:$COMMIT_SHA'
      - '--region'
      - 'me-west1'
      - '--platform'
      - 'managed'
images:
  - 'gcr.io/$PROJECT_ID/nutrition-service:$COMMIT_SHA'
