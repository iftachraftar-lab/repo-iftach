<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מעקב תזונה אישי</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-10">

  <!-- מסך נעילה -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 z-50">
    <div class="w-full max-w-xs space-y-4 text-center">
      <div class="text-4xl mb-2">🔒</div>
      <h2 class="text-xl font-bold text-white">אפליקציה פרטית</h2>
      <p class="text-xs text-slate-400">הזן קוד גישה כדי להתחבר ליומן התזונה שלך</p>
      
      <input type="password" id="passInput" placeholder="הזן קוד גישה" 
             class="w-full text-center tracking-widest text-lg bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
      
      <button onclick="handleLogin()" 
              class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 font-semibold py-3 rounded-xl transition">
        כניסה
      </button>
      <div id="loginError" class="text-xs text-rose-400 hidden">קוד שגוי, נסה שוב</div>
    </div>
  </div>

  <!-- דשבורד ראשי -->
  <div id="mainDashboard" class="max-w-md mx-auto p-4 space-y-4 hidden">
    
    <header class="flex justify-between items-center py-2 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">מעקב תזונה יומי</h1>
        <span id="currentDate" class="text-xs text-slate-400"></span>
      </div>
      <div class="flex space-x-2">
        <button onclick="showHistory()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
          היסטוריה 📅
        </button>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
          נעילה 🔒
        </button>
      </div>
    </header>

    <!-- קוביות מדדים -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50">
        <div class="text-xs text-slate-400">קלוריות שנצרכו</div>
        <div class="text-2xl font-black mt-1 text-white" id="calConsumed">0</div>
        <div class="text-xs text-slate-400 mt-1" id="calRemaining">יעד: 1800</div>
      </div>
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50">
        <div class="text-xs text-slate-400">חלבון כולל</div>
        <div class="text-2xl font-black mt-1 text-emerald-400" id="proteinConsumed">0g</div>
        <div class="text-xs text-slate-400 mt-1">מטרה יומית</div>
      </div>
    </div>

    <!-- סרגל התקדמות -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/50 space-y-2">
      <div class="flex justify-between text-xs text-slate-400">
        <span>התקדמות יומית</span>
        <span id="percentText">0%</span>
      </div>
      <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- רשימת ארוחות -->
    <div class="space-y-2">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-300">ארוחות היום</h2>
        <button onclick="loadData()" class="text-xs text-emerald-400 hover:underline">רענן ↻</button>
      </div>
      <div id="mealsList" class="space-y-2">
        <div class="text-xs text-slate-500 text-center py-6">טוען נתונים...</div>
      </div>
    </div>

  </div>

  <!-- היסטוריית ימים -->
  <div id="historyDashboard" class="max-w-md mx-auto p-4 space-y-4 hidden">
    <header class="flex justify-between items-center py-2 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">היסטוריית תזונה</h1>
        <span class="text-xs text-slate-400">צפה בנתונים היסטוריים</span>
      </div>
      <button onclick="showMainDashboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
        חזור למגש הכלים
      </button>
    </header>
    <div id="historyList" class="space-y-4">
      <div class="text-xs text-slate-500 text-center py-6">טוען נתונים היסטוריים...</div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js");
    }

    document.getElementById("currentDate").innerText = new Date().toLocaleDateString("he-IL");

    let savedPass = localStorage.getItem("app_password");

    function getPassword() {
      return savedPass || document.getElementById("passInput").value;
    }

    async function loadData() {
      const pass = getPassword();
      if (!pass) {
        showLogin();
        return;
      }

      try {
        const res = await fetch("/api/today", {
          headers: { "X-App-Password": pass }
        });

        if (res.status === 401) {
          showLogin(true);
          return;
        }

        const data = await res.json();
        
        localStorage.setItem("app_password", pass);
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("mainDashboard").classList.remove("hidden");

        document.getElementById("calConsumed").innerText = data.total_calories;
        document.getElementById("calRemaining").innerText = `נותר: ${data.remaining} מתוך ${data.target}`;
        document.getElementById("proteinConsumed").innerText = `${Math.round(data.total_protein)}g`;

        const pct = Math.min(100, Math.round((data.total_calories / data.target) * 100));
        document.getElementById("percentText").innerText = `${pct}%`;
        document.getElementById("progressBar").style.width = `${pct}%`;

        const list = document.getElementById("mealsList");
        if (!data.meals || data.meals.length === 0) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">אין ארוחות מתועדות להיום</div>';
          return;
        }

        list.innerHTML = data.meals.map(m => `
          <div class="bg-slate-800/60 p-3 rounded-xl flex justify-between items-center border border-slate-800">
            <div>
              <div class="font-medium text-sm text-slate-200">${m.description}</div>
              <div class="text-xs text-slate-500">${m.time}</div>
            </div>
            <div class="text-left flex items-center space-x-2">
              <div>
                <div class="text-sm font-bold text-amber-400">${m.calories} קק"ל</div>
                <div class="text-xs text-emerald-400">${Math.round(m.protein_g)}g חלבון</div>
              </div>
              <button onclick="deleteMeal('${m.id}')" class="text-xs text-rose-400 hover:text-rose-500 p-1 rounded-full">
                🗑️
              </button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function showLogin(isError = false) {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("mainDashboard").classList.add("hidden");
      if (isError) {
        document.getElementById("loginError").classList.remove("hidden");
        localStorage.removeItem("app_password");
        savedPass = null;
      }
    }

    function handleLogin() {
      savedPass = document.getElementById("passInput").value;
      loadData();
    }

    function logout() {
      localStorage.removeItem("app_password");
      savedPass = null;
      document.getElementById("passInput").value = "";
      showLogin(false);
    }

    async function loadHistoryData() {
        const pass = getPassword();
        if (!pass) {
            showLogin();
            return;
        }

        try {
            const res = await fetch("/api/history", {
                headers: { "X-App-Password": pass }
            });

            if (res.status === 401) {
                showLogin(true);
                return;
            }

            const data = await res.json();
            const historyList = document.getElementById("historyList");
            historyList.innerHTML = ""; // Clear previous content

            if (!data.history || data.history.length === 0) {
                historyList.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">אין נתונים היסטוריים</div>';
                return;
            }

            // Group data by date
            const groupedByDate = data.history.reduce((acc, item) => {
                const date = new Date(item.date).toLocaleDateString("he-IL", {
                    year: 'numeric',
                    month: 'numeric',
                    day: 'numeric'
                });
                if (!acc[date]) {
                    acc[date] = [];
                }
                acc[date].push(item);
                return acc;
            }, {});

            for (const date in groupedByDate) {
                const dayData = groupedByDate[date];
                const totalCalories = dayData.reduce((sum, item) => sum + item.total_calories, 0);
                const totalProtein = dayData.reduce((sum, item) => sum + item.total_protein, 0);

                historyList.innerHTML += `
                    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50">
                        <div class="text-sm font-bold text-emerald-400 mb-2">${date}</div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <div class="text-xs text-slate-400">קלוריות כולל</div>
                                <div class="text-xl font-black mt-1 text-white">${totalCalories}</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-400">חלבון כולל</div>
                                <div class="text-xl font-black mt-1 text-emerald-400">${Math.round(totalProtein)}g</div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${dayData.map(meal => `
                                <div class="bg-slate-700/60 p-3 rounded-xl flex justify-between items-center border border-slate-700">
                                    <div>
                                        <div class="font-medium text-sm text-slate-200">${meal.description}</div>
                                        <div class="text-xs text-slate-500">${new Date(meal.time).toLocaleTimeString("he-IL", { hour: '2-digit', minute: '2-digit' })}</div>
                                    </div>
                                    <div class="text-left">
                                        <div class="text-sm font-bold text-amber-400">${meal.calories} קק"ל</div>
                                        <div class="text-xs text-emerald-400">${Math.round(meal.protein_g)}g חלבון</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

        } catch (err) {
            console.error("Fetch history error:", err);
            historyList.innerHTML = '<div class="text-xs text-rose-400 text-center py-6">שגיאה בטעינת היסטוריה</div>';
        }
    }

    function showHistory() {
      document.getElementById("mainDashboard").classList.add("hidden");
      document.getElementById("historyDashboard").classList.remove("hidden");
      loadHistoryData(); // Load history data when showing the history dashboard
    }

    function showMainDashboard() {
      document.getElementById("historyDashboard").classList.add("hidden");
      document.getElementById("mainDashboard").classList.remove("hidden");
      loadData(); // Reload today's data when returning to the main dashboard
    }

    async function deleteMeal(mealId) {
        if (!confirm("האם אתה בטוח שברצונך למחוק ארוחה זו?")) {
            return;
        }

        const pass = getPassword();
        if (!pass) {
            showLogin();
            return;
        }

        try {
            const res = await fetch(`/api/meal/${mealId}`, {
                method: 'DELETE',
                headers: { "X-App-Password": pass }
            });

            if (res.status === 401) {
                showLogin(true);
                return;
            }

            if (res.ok) {
                console.log(`Meal ${mealId} deleted successfully.`);
                loadData(); // Refresh the meals list after deletion
            } else {
                console.error("Failed to delete meal:", await res.text());
                alert("שגיאה במחיקת הארוחה.");
            }
        } catch (err) {
            console.error("Delete meal error:", err);
            alert("שגיאה בתקשורת עם השרת.");
        }
    }

    if (savedPass) {
      loadData();
    } else {
      showLogin();
    }

    setInterval(() => {
      if (!document.getElementById("mainDashboard").classList.contains("hidden")) {
        loadData();
      }
    }, 15000);
  </script>
</body>
</html>
