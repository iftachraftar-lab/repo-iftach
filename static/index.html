<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>מעקב תזונה אישי</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-10">

  <!-- מסך נעילה (LOGIN MODAL) -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 z-50">
    <div class="w-full max-w-xs space-y-4 text-center">
      <div class="text-4xl mb-2">🔒</div>
      <h2 class="text-xl font-bold text-white">אפליקציה פרטית</h2>
      <p class="text-xs text-slate-400">הזן קוד גישה כדי להתחבר ליומן התזונה שלך</p>
      
      <input type="password" id="passInput" placeholder="הזן קוד גישה" 
             class="w-full text-center tracking-widest text-lg bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
      
      <button onclick="handleLogin()" 
              class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 font-semibold py-3 rounded-xl transition">
        כניסה
      </button>
      <div id="loginError" class="text-xs text-rose-400 hidden">קוד שגוי, נסה שוב</div>
    </div>
  </div>

  <!-- דשבורד ראשי -->
  <div id="mainDashboard" class="max-w-md mx-auto p-4 space-y-4 hidden">
    
    <!-- כותרת ראשית וכפתור התנתקות -->
    <header class="flex justify-between items-center py-2 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">מעקב תזונה יומי</h1>
        <span id="currentDate" class="text-xs text-slate-400"></span>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
        נעילה 🔒
      </button>
    </header>

    <!-- קוביות מדדים -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50">
        <div class="text-xs text-slate-400">קלוריות שנצרכו</div>
        <div class="text-2xl font-black mt-1 text-white" id="calConsumed">0</div>
        <div class="text-xs text-slate-400 mt-1" id="calRemaining">יעד: 1800</div>
      </div>
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50">
        <div class="text-xs text-slate-400">חלבון כולל</div>
        <div class="text-2xl font-black mt-1 text-emerald-400" id="proteinConsumed">0g</div>
        <div class="text-xs text-slate-400 mt-1">מטרה יומית</div>
      </div>
    </div>

    <!-- סרגל התקדמות -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/50 space-y-2">
      <div class="flex justify-between text-xs text-slate-400">
        <span>התקדמות יומית</span>
        <span id="percentText">0%</span>
      </div>
      <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- היסטוריית ארוחות היום -->
    <div class="space-y-2">
      <h2 class="text-sm font-semibold text-slate-300">ארוחות היום</h2>
      <div id="mealsList" class="space-y-2">
        <div class="text-xs text-slate-500 text-center py-6">טוען נתונים...</div>
      </div>
    </div>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js");
    }

    document.getElementById("currentDate").innerText = new Date().toLocaleDateString("he-IL");

    let savedPass = localStorage.getItem("app_password");

    function getPassword() {
      return savedPass || document.getElementById("passInput").value;
    }

    async function loadData() {
      const pass = getPassword();
      if (!pass) {
        showLogin();
        return;
      }

      try {
        const res = await fetch("/api/today", {
          headers: { "X-App-Password": pass }
        });

        if (res.status === 401) {
          showLogin(true);
          return;
        }

        const data = await res.json();
        
        // התחברות הצליחה
        localStorage.setItem("app_password", pass);
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("mainDashboard").classList.remove("hidden");

        document.getElementById("calConsumed").innerText = data.total_calories;
        document.getElementById("calRemaining").innerText = `נותר: ${data.remaining} מתוך ${data.target}`;
        document.getElementById("proteinConsumed").innerText = `${Math.round(data.total_protein)}g`;

        const pct = Math.min(100, Math.round((data.total_calories / data.target) * 100));
        document.getElementById("percentText").innerText = `${pct}%`;
        document.getElementById("progressBar").style.width = `${pct}%`;

        const list = document.getElementById("mealsList");
        if (!data.meals || data.meals.length === 0) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">אין ארוחות מתועדות להיום</div>';
          return;
        }

        list.innerHTML = data.meals.map(m => `
          <div class="bg-slate-800/60 p-3 rounded-xl flex justify-between items-center border border-slate-800">
            <div>
              <div class="font-medium text-sm text-slate-200">${m.description}</div>
              <div class="text-xs text-slate-500">${m.time}</div>
            </div>
            <div class="text-left">
              <div class="text-sm font-bold text-amber-400">${m.calories} קק"ל</div>
              <div class="text-xs text-emerald-400">${Math.round(m.protein_g)}g חלבון</div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    function showLogin(isError = false) {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("mainDashboard").classList.add("hidden");
      if (isError) {
        document.getElementById("loginError").classList.remove("hidden");
        localStorage.removeItem("app_password");
        savedPass = null;
      }
    }

    function handleLogin() {
      savedPass = document.getElementById("passInput").value;
      loadData();
    }

    function logout() {
      localStorage.removeItem("app_password");
      savedPass = null;
      document.getElementById("passInput").value = "";
      showLogin(false);
    }

    // הפעלה ראשונית
    if (savedPass) {
      loadData();
    } else {
      showLogin();
    }

    setInterval(() => {
      if (!document.getElementById("mainDashboard").classList.contains("hidden")) {
        loadData();
      }
    }, 10000);
  </script>
</body>
</html>
